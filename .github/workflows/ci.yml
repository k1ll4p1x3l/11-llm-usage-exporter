name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI_SKIP_DOCS_ONLY: "true"
  GO_VERSION: "1.26.9"
  SYFT_VERSION: "v1.44.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_quality: ${{ steps.scope.outputs.run_quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_OUTPUT_NAME: run_quality
        run: bash scripts/ci-change-scope.sh "$BASE_SHA" "$GITHUB_SHA"
      - name: Public-repository safety
        run: python3 scripts/public_repo_sanity_check.py
      - name: Automation, public-safety, and artifact contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup Go
        if: steps.scope.outputs.run_quality == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        if: steps.scope.outputs.run_quality == 'true'
        run: |
          if [ -n "$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)" ]; then
            echo "Go files are not formatted"
            exit 1
          fi
      - name: Run tests
        if: steps.scope.outputs.run_quality == 'true'
        run: go test ./...
      - name: Run race detector
        if: steps.scope.outputs.run_quality == 'true'
        run: go test -race ./...
      - name: Run vet
        if: steps.scope.outputs.run_quality == 'true'
        run: go vet ./...

  cross-os-test:
    name: cross-os-test (${{ matrix.os }})
    needs: ci
    if: needs.ci.outputs.run_quality == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests
        run: go test ./...

  release-contract:
    name: release-contract
    needs: ci
    if: needs.ci.outputs.run_quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Syft
        id: download-syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Add Syft to PATH
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"
        env:
          SYFT_CMD: ${{ steps.download-syft.outputs.cmd }}
      - name: Build unpublished snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.16.0
          args: release --snapshot --clean --skip=publish
      - name: Verify module and release artifacts
        run: |
          git diff --exit-code -- go.mod go.sum
          python3 scripts/verify_release_artifacts.py --dist dist
